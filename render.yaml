services:
  - type: web
    name: sense-barbershop
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Disco persistente (Render): monte em /var/data e defina:
      # DATABASE_PATH=/var/data/barbearia_sense.db
