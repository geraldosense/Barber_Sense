services:
  - type: web
    name: sense-barbershop
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    disk:
      name: sense-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/barbearia_sense.db
      - key: UPLOADS_PATH
        value: /var/data/uploads
      - key: DATA_DIR
        value: /var/data
      - key: NOTIFY_BOOKING_EMAIL
        value: sensebarber10@gmail.com
      - key: ADMIN_EMAILS
        value: sensebarber10@gmail.com
      # Persistência no plano Free (sem disco): criar DB em https://turso.tech
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
