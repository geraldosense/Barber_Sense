<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a1a">
    <title>Redefinir Palavra-passe — Sense Barbershop</title>
    <link rel="icon" type="image/jpeg" href="assets/logo.png?v=27">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/conta.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body class="conta-page conta-page--cliente">
    <div class="conta-shell">
        <div class="conta-card conta-card--cliente">
            <div class="conta-card-top">
                <a href="conta.html" class="conta-back-top"><i class="fas fa-arrow-left"></i> Voltar ao login</a>
            </div>

            <div class="conta-brand-center">
                <img src="assets/logo.png?v=27" alt="Sense Barbershop" class="conta-logo-top">
            </div>

            <div class="conta-card-header">
                <h2>Nova palavra-passe</h2>
                <p>Defina uma nova palavra-passe para a sua conta.</p>
            </div>

            <form id="formRedefinir">
                <div class="form-group">
                    <label for="novaPassword">Nova palavra-passe</label>
                    <div class="password-input">
                        <input type="password" id="novaPassword" required minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                        <button type="button" class="toggle-password" aria-label="Mostrar"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar palavra-passe</label>
                    <input type="password" id="confirmPassword" required minlength="6" placeholder="Repita a palavra-passe" autocomplete="new-password">
                </div>
                <button type="submit" class="auth-submit-btn auth-submit-btn--pill">Redefinir palavra-passe</button>
            </form>

            <div class="auth-message hidden" id="msg"></div>
            <p class="auth-switch"><a href="conta.html">Ir para o login</a></p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        const msg = document.getElementById('msg');
        const form = document.getElementById('formRedefinir');

        document.querySelectorAll('.toggle-password').forEach((btn) => {
            btn.addEventListener('click', () => {
                const input = btn.parentElement.querySelector('input');
                const icon = btn.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'fas fa-eye-slash';
                } else {
                    input.type = 'password';
                    icon.className = 'fas fa-eye';
                }
            });
        });

        if (!token) {
            msg.textContent = 'Link de recuperação inválido ou incompleto. Peça um novo em «Esqueci a palavra-passe».';
            msg.className = 'auth-message error';
            msg.classList.remove('hidden');
            form.style.display = 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('novaPassword').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (password !== confirm) {
                msg.textContent = 'As palavras-passe não coincidem.';
                msg.className = 'auth-message error';
                msg.classList.remove('hidden');
                return;
            }

            const btn = form.querySelector('button[type="submit"]');
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'A guardar…';
            }

            try {
                const res = await fetch(`${API_URL}/auth/redefinir-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();

                msg.textContent = res.ok ? data.mensagem : (data.erro || 'Erro ao redefinir.');
                msg.className = `auth-message ${res.ok ? 'success' : 'error'}`;
                msg.classList.remove('hidden');

                if (res.ok) {
                    form.reset();
                    setTimeout(() => { window.location.href = 'conta.html'; }, 2000);
                } else if (btn) {
                    btn.disabled = false;
                    btn.textContent = 'Redefinir palavra-passe';
                }
            } catch {
                msg.textContent = 'Erro de ligação ao servidor. Tente novamente.';
                msg.className = 'auth-message error';
                msg.classList.remove('hidden');
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = 'Redefinir palavra-passe';
                }
            }
        });
    </script>
</body>
</html>
