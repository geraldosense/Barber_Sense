<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Sense Barbershop</title>
    <link rel="icon" type="image/png" href="assets/logo-clear.png?v=31">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body.admin-login-page {
            min-height: 100vh;
            background: linear-gradient(145deg, #0a0a0a 0%, #1a1a1a 50%, #0d0d0d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .admin-login-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 14px;
            padding: 2rem 2rem 1.75rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
        }
        .admin-login-back {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            text-decoration: none;
        }
        .admin-login-back:hover { color: var(--secondary-color); }

        .adm-brand {
            text-align: center;
            padding: 0.25rem 0.5rem 1.5rem;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .adm-brand-logo-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 108px;
            height: 108px;
            margin: 0 auto 1rem;
            padding: 0.75rem;
            background: radial-gradient(circle at 50% 42%, #141414 0%, #050505 100%);
            border: 2px solid rgba(212, 175, 55, 0.55);
            border-radius: 50%;
            box-shadow:
                0 10px 28px rgba(0, 0, 0, 0.45),
                inset 0 0 18px rgba(0, 0, 0, 0.55);
        }

        .adm-brand-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .adm-brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: #1a1a1a;
            display: block;
            line-height: 1.2;
            letter-spacing: 0.02em;
        }

        .adm-brand-tag {
            display: block;
            margin-top: 0.35rem;
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--secondary-color);
        }

        .adm-subtitle {
            font-size: 0.85rem;
            color: #666;
            text-align: center;
            margin-bottom: 1.25rem;
            margin-top: 0.25rem;
        }

        .adm-err {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 0.65rem 0.85rem;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .adm-err.hidden {
            display: none;
        }
    </style>
</head>
<body class="admin-login-page">
    <div class="admin-login-card">
        <a href="index.html" class="admin-login-back"><i class="fas fa-arrow-left"></i> Voltar ao site</a>

        <div class="adm-brand" style="border-bottom:none;padding-bottom:0.5rem;">
            <div class="adm-brand-logo-wrap">
                <img src="assets/logo-clear.png?v=31" alt="Sense Barbershop" class="adm-brand-logo">
            </div>
            <span class="adm-brand-name">Sense Barbershop</span>
            <span class="adm-brand-tag">Painel de Administração</span>
        </div>

        <p class="adm-subtitle">Acesso exclusivo ao painel</p>
        <div class="adm-err hidden" id="admLoginErr"></div>

        <form id="formAdminLogin">
            <div class="form-group">
                <label class="lbl" for="admUser">Email</label>
                <input type="email" id="admUser" required placeholder="sensebarber10@gmail.com" autocomplete="username">
            </div>
            <div class="form-group">
                <label class="lbl" for="admPass">Palavra-passe</label>
                <input type="password" id="admPass" required placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="auth-submit-btn"><i class="fas fa-sign-in-alt"></i> Entrar no Painel</button>
        </form>
    </div>

    <script src="js/config.js"></script>
    <script src="js/admin-login.js"></script>
</body>
</html>
